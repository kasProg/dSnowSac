# Tesseract configuration for the Snow-17 wrapper.
# See tesseracts/snow17/tesseract_api.py for the endpoint implementations.

name: "snow17"
version: "0.1.0"
description: >
  Differentiable Snow-17 (NOAA-OWP, Apache-2.0) wrapped for Tesseract.
  apply() runs EXSNOW19 over a daily time series for one HRU via
  fortran/snow17_shim.f90; jacobian_vector_product() (forward mode) and
  vector_jacobian_product() (reverse mode) both compute derivatives
  w.r.t. the 11 learnable scalar parameters via tesseract-core's
  experimental finite-difference helpers over full rollouts. The coupled
  pipeline drives forward mode.

env:
  # Matches tesseract_api.py's _REPO_ROOT fallback logic -- see the
  # comment there for why the container's flat /tesseract/tesseract_api.py
  # layout needs this instead of the local-dev relative-path heuristic.
  TESSERACT_PROJECT_ROOT: "/tesseract"

build_config:
  target_platform: "native"

  # gfortran to compile the shim inside the container -- do NOT ship a
  # host-built .so instead (glibc/arch mismatches between this dev
  # machine and the container base image are exactly the kind of
  # silent-wrongness failure this project is built to avoid elsewhere).
  extra_packages:
    - gfortran

  # Source paths are relative to this directory (tesseracts/snow17/);
  # tesseract_core resolves out-of-tree paths and stages them
  # automatically (confirmed by reading tesseract_core.sdk.engine's
  # prepare_build_context -- see notes/logs.md). Only the snow19/
  # physics subdir is copied, not the whole submodule (docs, CMake
  # files, etc. the container doesn't need).
  package_data:
    - [../../fortran, /tesseract/fortran]
    - [../../external/snow17/src/snow19, /tesseract/external/snow17/src/snow19]
    - [../../src, /tesseract/src]

  # Runs as root, after extra_packages install, before the container
  # drops to a non-root user (confirmed from Dockerfile.base's template
  # ordering) -- same build script local dev uses via `make build`, so
  # there is exactly one place that knows how to build this shim.
  custom_build_steps:
    - "RUN /tesseract/fortran/build.sh"
