# Prediction-in-ungauged-period (PUP): the SAME basins (all of
# data.selected_basins_csv, ignoring its "split" column) are used for
# both groups, but train_window and test_window cover different dates --
# generalization is being tested across TIME, not across basin identity.
#
# This is the split shape the parked full-CAMELS-671/dHBV-period
# comparison will need later (see notes/logs.md's "Parked for later"
# entry). Coverage of the default windows, checked over all 671 CAMELS
# basins: every basin has observed streamflow in both; in the 531-basin
# subset none has a missing day; across all 671, 2 basins miss >20% of
# the train window and 1 has some missing days in the test window.
# Override both windows per experiment.
mode: temporal
train_window:
  start: "1990-10-01"
  end: "1993-09-30"
test_window:
  start: "1993-10-01"
  end: "1996-09-30"
