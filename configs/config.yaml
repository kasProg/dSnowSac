# Top-level Hydra config for src/train.py. The default split is
# temporal (all basins, train WY1991-1993, test WY1994-1996).
# results/runs/model_9yrs_spatial/ is reproduced with
#
#   .venv/bin/python src/train.py split=spatial device=cpu
#
# (see results/README.md). Override any group from the CLI, e.g.:
#
#   .venv/bin/python src/train.py data=camels_531
#   .venv/bin/python src/train.py seed=1 train.lr=1e-3
#
# See the main README's "Reproduce" section.
defaults:
  - data: camels_snow35
  - split: temporal
  - model: hybrid
  - train: hybrid
  - _self_

seed: 0

# Where ParamNet and the loss run: cpu, cuda, cuda:N, or auto (CUDA if
# available). The Fortran physics always runs on CPU regardless. The
# saved results/runs/ were trained on CPU; CUDA kernels are not
# bitwise-identical to CPU ones, so use device=cpu to reproduce them.
device: cuda

# Worker processes for the Fortran physics (src/physics_pool.py). Each
# basin's 27 gradient passes are spread across them; 0 runs everything
# in this process. Results are identical for any value.
n_workers: 32

# Each run gets its own timestamped directory: saved config.yaml,
# checkpoint.pt, history.json -- see src/train.py's run_training().
output_dir: results/runs/${model.name}_${split.mode}_${now:%Y%m%d-%H%M%S}

hydra:
  # Don't let Hydra chdir into its own run directory -- this project's
  # data paths (data/camels/...) are relative to the repo root. Point
  # Hydra's OWN bookkeeping (.hydra/config.yaml, train.log) at the same
  # output_dir src/train.py itself writes config.yaml/checkpoint.pt/
  # history.json to, rather than leaving it at "." (which litters the
  # repo root with a .hydra/ dir + log file on every single run).
  job:
    chdir: false
  run:
    dir: ${output_dir}
