# Cost with the defaults (data=camels_531, split=temporal training on
# WY2000-2008): 194 steps per epoch of 100 basins x one 730-day window
# (365 warmup + 365 scored), each basin 27 forward-mode passes. Measured
# ~6.4 s per step with n_workers=32 on a shared 104-core server, so ~21
# min per epoch, ~35 h for 100 epochs. results/runs/model_9yrs_spatial/
# used full windows and full batches instead: rho=null, batch_size=null,
# n_epochs=150 (see configs/config.yaml for the full command).
n_epochs: 100
# Test-set evaluation every N epochs, plus after epoch 1 and the last
# epoch. 0 = only those two.
eval_every: 10
lr: 3e-3
# Basins per gradient step. null = all training basins, one full-batch
# step per epoch (what every saved run used). A smaller value takes
# several shuffled minibatch steps per epoch -- worth it once the basin
# count grows well past what one step should average over.
batch_size: 100
# Time-window minibatching (HydroDL-style). null = every step runs each
# basin's full training window (what every saved run used). Set to e.g.
# 365: each step draws batch_size distinct random basins (null = all) and
# a random window per basin -- `warmup` spin-up days from a cold start,
# then `rho` days the loss scores, normalized by the basin's whole
# training-window variance (src/data_module.py's window_nse_loss). The
# training window must hold at least warmup + rho days. median_train_nse
# is then the median over every window sampled in the epoch.
rho: 365
warmup: 365
# Steps per epoch when rho is set. null = enough that each (basin, day)
# is scored with ~99% probability (src/train.py's iterations_per_epoch).
iters_per_epoch: null
# Periodic resume-capable checkpoint (model + optimizer state), written
# to output_dir/checkpoints/epoch_%04d.pt every N epochs and once more
# on the final epoch regardless of N -- see src/train.py's run_training().
checkpoint_every: 10
